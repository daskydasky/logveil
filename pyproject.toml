[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logveil"
version = "0.1.0"
description = "Deterministically anonymize logs while preserving statistical value."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
logveil = "logveil.cli:main"
